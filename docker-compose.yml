services:
  db:
    image: postgres:17-alpine
    container_name: batch-orchestrator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator_dev
    ports:
      - "5433:5432"
    volumes:
      - orchestrator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orchestrator_pgdata:
